# Configuração do Alembic (migrações do banco do Quimativa).
# Rodar os comandos a partir da raiz do projeto, com o venv ativo:
#   alembic upgrade head
#   alembic revision --autogenerate -m "descricao"
#
# O endereço do banco NÃO fica aqui: vem de backend/config.py.

[alembic]
script_location = %(here)s/backend/database/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
